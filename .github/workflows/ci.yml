name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Security tests
        run: npm run test:security

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          # check-env.mjs skips .env.local when VERCEL is set
          VERCEL: "1"
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-anon-placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-service-placeholder-key
          ZALMOX_ADMIN_EMAILS: ci@example.com
          NEXT_PUBLIC_PLATFORM_DOMAIN: ci.example.com
          NEXT_PUBLIC_SITE_URL: https://ci.example.com
